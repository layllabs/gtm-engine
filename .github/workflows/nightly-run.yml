name: nightly engine run

# Reruns the engine with --as-of today so recency scores decay as the
# sample signals age, and commits the scoreboard when the ranking moves.
# In production the same job points at live exports instead of
# data/sample. On sample data this is a smoke test that the pipeline
# still runs end to end on a fresh checkout, nothing more.

on:
  schedule:
    - cron: "17 13 * * 1-5"   # 06:17 Pacific, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run engine as of today
        run: python -m gtm run --as-of today --out examples/output
      - name: Commit scoreboard if the ranking changed
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add examples/output
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "nightly engine run $(date -u +%F)"
            git push
          fi
